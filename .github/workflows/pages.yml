name: Check and deploy review site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install document renderer
        run: python -m pip install -r requirements.txt
      - name: Build both review books
        run: python tools/build.py
      - name: Check links, quiz calculations and boundary cases
        run: python tools/check.py
      - name: Stage public files
        run: |
          mkdir _site
          cp *.html _site/
          cp -R "Week 1" "Week 2" "Week 3" "Week 4" "Week 5" "Week 6" "Week 7" "Week 8" _site/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
